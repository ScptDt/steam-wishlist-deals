<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Steam Tools - Demo Compartir</title>
<style>
:root { --bg: #1b2838; --bg2: #2a475e; --card: #16202d; --card-border: #2a475e; --accent: #66c0f4; --accent-hover: #4db8e8; --text: #c7d5e0; --text2: #8f98a0; --green: #6cc644; --yellow: #f0b232; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
h2 { color: var(--accent); margin-bottom: 1rem; }
.game-row { display: flex; align-items: center; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid var(--card-border); }
.game-name { flex: 1; font-weight: 500; }
.game-price { color: var(--green); font-weight: 600; }
.share-btn { background: var(--bg2); border: 1px solid var(--card-border); border-radius: 4px; padding: 0.3rem 0.6rem; cursor: pointer; font-size: 1rem; }
.share-btn:hover { background: var(--accent); }
.pick-card { position: relative; display: inline-block; background: var(--card); border: 1px solid var(--card-border); border-radius: 8px; padding: 1rem; margin: 0.5rem; width: 200px; }
.share-btn-mini { position: absolute; top: 0.5rem; right: 0.5rem; background: var(--bg); border: 1px solid var(--card-border); border-radius: 4px; padding: 0.3rem 0.5rem; cursor: pointer; font-size: 0.9rem; opacity: 0.6; }
.share-btn-mini:hover { opacity: 1; background: var(--accent); }
.share-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
.share-modal.active { display: flex; }
.share-modal-content { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.5rem; max-width: 420px; width: 90%; }
.share-modal h3 { color: var(--accent); margin-bottom: 1rem; }
.share-game-info { background: var(--bg); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
.share-game-name { font-weight: 600; margin-bottom: 0.5rem; }
.share-game-price { color: var(--green); font-size: 1.2rem; font-weight: 700; }
.share-game-price span { text-decoration: line-through; color: var(--text2); font-weight: 400; font-size: 0.9rem; }
.share-game-minhist { font-size: 0.8rem; color: var(--text2); margin-top: 0.3rem; }
.share-game-minhist span { color: var(--yellow); }
.share-actions { display: flex; flex-direction: column; gap: 0.6rem; }
.share-btn-action { padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; }
.share-btn-copy-app { background: var(--accent); color: #000; border: none; }
.share-btn-copy-steam { background: var(--bg2); color: var(--text); border: 1px solid var(--card-border); }
.share-btn-open { background: var(--bg); color: var(--text2); border: 1px solid var(--card-border); }
.share-close { margin-top: 0.8rem; text-align: center; color: var(--text2); font-size: 0.85rem; cursor: pointer; }
</style>
</head>
<body>

<h1>Demo: Botones de Compartir</h1>
<p>Haz click en el botón 🔗 de cualquier juego para probar el modal de compartir.</p>

<div class="card">
  <h2>Top Picks</h2>
  <div class="pick-card">
    <strong>Hollow Knight</strong>
    <div style="color: var(--green)">$59 MXN (-75%)</div>
    <button class="share-btn-mini" onclick='openShareModal({"name":"Hollow Knight","appid":"367520","price":"$59","price_original":"$239","discount":75,"min_hist":"$39"})'>🔗</button>
  </div>
  <div class="pick-card">
    <strong>Celeste</strong>
    <div style="color: var(--green)">$29 MXN (-80%)</div>
    <button class="share-btn-mini" onclick='openShareModal({"name":"Celeste","appid":"504230","price":"$29","price_original":"$149","discount":80,"min_hist":"$19"})'>🔗</button>
  </div>
</div>

<div class="card">
  <h2>Todos los Deals</h2>
  <div class="game-row">
    <span class="game-name">Hollow Knight</span>
    <span class="game-price">$59 (-75%)</span>
    <button class="share-btn" onclick='openShareModal({"name":"Hollow Knight","appid":"367520","price":"$59","price_original":"$239","discount":75,"min_hist":"$39"})'>🔗 Compartir</button>
  </div>
  <div class="game-row">
    <span class="game-name">Celeste</span>
    <span class="game-price">$29 (-80%)</span>
    <button class="share-btn" onclick='openShareModal({"name":"Celeste","appid":"504230","price":"$29","price_original":"$149","discount":80,"min_hist":"$19"})'>🔗 Compartir</button>
  </div>
  <div class="game-row">
    <span class="game-name">Dead Cells</span>
    <span class="game-price">$45 (-65%)</span>
    <button class="share-btn" onclick='openShareModal({"name":"Dead Cells","appid":"588650","price":"$45","price_original":"$129","discount":65,"min_hist":"$25"})'>🔗 Compartir</button>
  </div>
</div>

<!-- Share Modal -->
<div class="share-modal" id="share-modal">
  <div class="share-modal-content">
    <h3>Compartir Deal</h3>
    <div class="share-game-info">
      <div class="share-game-name" id="share-name"></div>
      <div class="share-game-price" id="share-price"></div>
      <div class="share-game-minhist" id="share-minhist"></div>
    </div>
    <div class="share-actions">
      <button class="share-btn-action share-btn-copy-app" id="btn-copy-app" onclick="copyShareLink()">Copiar link steamtools://</button>
      <button class="share-btn-action share-btn-copy-steam" onclick="copySteamLink()">Copiar link de Steam</button>
      <button class="share-btn-action share-btn-open" onclick="openInSteam()">Abrir en Steam</button>
    </div>
    <div class="share-close" onclick="closeShareModal()">Cerrar</div>
  </div>
</div>

<script>
let currentShareData = null;
let currentSteamUrl = '';

function openShareModal(game) {
  currentShareData = game;
  currentSteamUrl = 'https://store.steampowered.com/app/' + game.appid + '/';
  document.getElementById('share-name').textContent = game.name || '';
  document.getElementById('share-price').innerHTML = (game.price_original && game.price ? '<span>$' + game.price_original + ' </span>' : '') + (game.price || '') + (game.discount ? ' (' + game.discount + '% OFF)' : '');
  document.getElementById('share-minhist').innerHTML = game.min_hist ? 'Minimo historico: <span>$' + game.min_hist + '</span>' : '';
  document.getElementById('share-modal').classList.add('active');
}

function closeShareModal() {
  document.getElementById('share-modal').classList.remove('active');
  currentShareData = null;
}

function copyShareLink() {
  if (!currentShareData) return;
  const encoded = btoa(JSON.stringify(currentShareData));
  const shareUrl = 'steamtools://share?data=' + encoded;
  navigator.clipboard.writeText(shareUrl).then(() => {
    const btn = document.getElementById('btn-copy-app');
    btn.textContent = 'Copiado!';
    setTimeout(() => btn.textContent = 'Copiar link steamtools://', 2000);
  });
}

function copySteamLink() {
  if (!currentSteamUrl) return;
  navigator.clipboard.writeText(currentSteamUrl).then(() => {
    const btn = document.querySelector('.share-btn-copy-steam');
    btn.textContent = 'Copiado!';
    setTimeout(() => btn.textContent = 'Copiar link de Steam', 2000);
  });
}

function openInSteam() {
  if (currentSteamUrl) window.open(currentSteamUrl, '_blank');
}
</script>

</body>
</html>
